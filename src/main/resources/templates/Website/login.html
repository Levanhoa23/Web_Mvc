<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="Website/inc :: links"></head>
<body class="gradient-bg">
<div th:replace="Website/inc :: header"></div>
  <main class="pt-90">
    <div class="mb-4 pb-4"></div>
    <section class="login-register container">
      <ul class="nav nav-tabs mb-5" id="login_register" role="tablist">
        <li class="nav-item" role="presentation">
          <a class="nav-link nav-link_underscore active" id="login-tab" data-bs-toggle="tab" href="#tab-item-login"
            role="tab" aria-controls="tab-item-login" aria-selected="true">Login</a>
        </li>
      </ul>
      <div class="tab-content pt-2" id="login_register_tab_content">
        <div class="tab-pane fade show active" id="tab-item-login" role="tabpanel" aria-labelledby="login-tab">
          <div class="login-form">
            <form method="POST" action="/login" class="needs-validation" novalidate="">

              <!-- Hiển thị thông báo -->
              <div th:if="${message}" class="alert text-center"
                   th:classappend="${messageColor == 'red' ? 'alert-danger' : 'alert-success'}">
                <span th:text="${message}"></span>
              </div>

              <div class="form-floating mb-3">
                <input id="email" type="email" class="form-control" name="email" th:value="${user.email}" required="">
                <label for="email">Email address *</label>
              </div>

              <div class="form-floating mb-3">
                <input id="password" type="password" class="form-control" name="password" required="">
                <label for="password">Password *</label>
              </div>

              <button class="btn btn-primary w-100 text-uppercase" type="submit">Login</button>

              <div class="customer-option mt-4 text-center">
                <span class="text-secondary">Don't have an account?</span>
                <a th:href="@{/register}" class="btn-text js-show-register">Register Now</a>
              </div>
            </form>
          </div>

        </div>
      </div>
    </section>
  </main>
  <div th:replace="Website/inc :: footer"></div>
</body>

</html>
