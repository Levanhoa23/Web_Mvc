<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="Website/inc :: links"></head>
<body class="gradient-bg">
<div th:replace="Website/inc :: header"></div>
<main >
  <div th:replace="Website/inc :: slider"></div>
    <section class="hot-deals container">
      <h2 class="section-title text-center mb-3 pb-xl-3 mb-xl-4">Hot Deals</h2>
      <div class="row">
        <div
                class="col-md-6 col-lg-4 col-xl-20per d-flex align-items-center flex-column justify-content-center py-4 align-items-md-start">
          <h2>Summer Sale</h2>
          <h2 class="fw-bold">Up to 60% Off</h2>

          <div class="position-relative d-flex align-items-center text-center pt-xxl-4 js-countdown mb-3"
               data-date="18-3-2024" data-time="06:50">
            <div class="day countdown-unit">
              <span class="countdown-num d-block"></span>
              <span class="countdown-word text-uppercase text-secondary">Days</span>
            </div>

            <div class="hour countdown-unit">
              <span class="countdown-num d-block"></span>
              <span class="countdown-word text-uppercase text-secondary">Hours</span>
            </div>

            <div class="min countdown-unit">
              <span class="countdown-num d-block"></span>
              <span class="countdown-word text-uppercase text-secondary">Mins</span>
            </div>

            <div class="sec countdown-unit">
              <span class="countdown-num d-block"></span>
              <span class="countdown-word text-uppercase text-secondary">Sec</span>
            </div>
          </div>

          <a href="#" class="btn-link default-underline text-uppercase fw-medium mt-3">View All</a>
        </div>
        <div class="col-md-6 col-lg-8 col-xl-80per">
          <div class="position-relative">
            <div class="swiper-container js-swiper-slider" data-settings='{
                  "autoplay": {
                    "delay": 5000
                  },
                  "slidesPerView": 4,
                  "slidesPerGroup": 4,
                  "effect": "none",
                  "loop": false,
                  "breakpoints": {
                    "320": {
                      "slidesPerView": 2,
                      "slidesPerGroup": 2,
                      "spaceBetween": 14
                    },
                    "768": {
                      "slidesPerView": 2,
                      "slidesPerGroup": 3,
                      "spaceBetween": 24
                    },
                    "992": {
                      "slidesPerView": 3,
                      "slidesPerGroup": 1,
                      "spaceBetween": 30,
                      "pagination": false
                    },
                    "1200": {
                      "slidesPerView": 4,
                      "slidesPerGroup": 1,
                      "spaceBetween": 30,
                      "pagination": false
                    }
                  }
                }'>
              <div class="swiper-wrapper">
                <div class="swiper-slide product-card product-card_style3" th:each="product : ${featuredProducts}">
                  <div class="pc__img-wrapper">
                    <!-- Sửa href với đường dẫn chi tiết sản phẩm sử dụng slug và id -->
                    <a th:href="@{/products/{slug}-{id}.html(slug=${product.slug}, id=${product.id})}">
                      <img th:src="@{${product.thumbnail}}" width="258" height="313"
                           th:alt="${product.name}" class="pc__img">
                      <img th:src="@{${product.thumbnail}}" width="258" height="313"
                           th:alt="${product.name}" class="pc__img pc__img-second">
                    </a>
                  </div>
                  <div class="pc__info position-relative">
                    <h6 class="pc__title">
                      <a th:href="@{/products/{slug}-{id}.html(slug=${product.slug}, id=${product.id})}" th:text="${product.name}"></a>
                    </h6>
                    <div class="product-card__price d-flex">
                      <span class="money price text-secondary" th:text="'$' + ${product.price}"></span>
                    </div>

                    <div class="anim_appear-bottom position-absolute bottom-0 start-0 d-none d-sm-flex align-items-center bg-body">
                      <button class="btn-link btn-link_lg me-4 text-uppercase fw-medium js-add-cart js-open-aside"
                              data-aside="cartDrawer" title="Add To Cart">Add To Cart</button>
                      <button class="btn-link btn-link_lg me-4 text-uppercase fw-medium js-quick-view"
                              data-bs-toggle="modal" data-bs-target="#quickView" title="Quick view">
                        <span class="d-none d-xxl-block">Quick View</span>
                        <span class="d-block d-xxl-none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                                              xmlns="http://www.w3.org/2000/svg">
                        <use href="#icon_view" />
                    </svg></span>
                      </button>
                      <button class="pc__btn-wl bg-transparent border-0 js-add-wishlist" title="Add To Wishlist">
                        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                          <use href="#icon_heart" />
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>

              </div><!-- /.swiper-wrapper -->
            </div><!-- /.swiper-container js-swiper-slider -->
          </div><!-- /.position-relative -->
        </div>
      </div>
    </section>
    <div class="mb-3 mb-xl-5 pt-1 pb-4"></div>
    <section class="category-banner container">
      <div class="row">
        <div class="col-md-6">
          <div class="category-banner__item border-radius-10 mb-5">
              <img loading="lazy" class="h-auto" src="assets/images/home/demo3/category_9.jpg" width="690" height="665"
                 alt="" />
            <div class="category-banner__item-mark">
              Starting at $19
            </div>
            <div class="category-banner__item-content">
              <h3 class="mb-0">Blazers</h3>
              <a href="#" class="btn-link default-underline text-uppercase fw-medium">Shop Now</a>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="category-banner__item border-radius-10 mb-5">
            <img loading="lazy" class="h-auto" src="assets/images/home/demo3/category_10.jpg" width="690" height="665"
                 alt="" />
            <div class="category-banner__item-mark">
              Starting at $19
            </div>
            <div class="category-banner__item-content">
              <h3 class="mb-0">Sportswear</h3>
              <a href="#" class="btn-link default-underline text-uppercase fw-medium">Shop Now</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="mb-3 mb-xl-5 pt-1 pb-4"></div>
    <section class="products-grid container">
      <h2 class="section-title text-center mb-3 pb-xl-3 mb-xl-4">Featured Products</h2>
      <div class="row">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${featuredProducts}" th:href="@{/products/{slug}-{id}.html(slug=${product.getSlug()},id=${product.id})}">
          <div class="product-card product-card_style3 mb-3 mb-md-4 mb-xxl-5" >
            <div class="pc__img-wrapper">
              <a th:href="@{/products/{slug}-{id}.html(slug=${product.slug}, id=${product.id})}">
                  <img th:src="@{${product.thumbnail}}" width="330" height="400"
                     th:alt="${product.name}" class="pc__img">
              </a>
            </div>
            <div class="pc__info position-relative">
              <h6 class="pc__title">
                  <a th:href="@{/product/{id}(id=${product.id})}" th:text="${product.name}"></a>
              </h6>
              <div class="product-card__price d-flex align-items-center">
                  <span class="money price text-secondary" th:text="'$' + ${product.price}"></span>
              </div>
              <div class="anim_appear-bottom position-absolute bottom-0 start-0 d-none d-sm-flex align-items-center bg-body">
                <button class="btn-link btn-link_lg me-4 text-uppercase fw-medium js-add-cart js-open-aside"
                        data-aside="cartDrawer" title="Add To Cart">Add To Cart</button>
                <button class="btn-link btn-link_lg me-4 text-uppercase fw-medium js-quick-view"
                        data-bs-toggle="modal" data-bs-target="#quickView" title="Quick view">
                  <span class="d-none d-xxl-block">Quick View</span>
                  <span class="d-block d-xxl-none"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                                        xmlns="http://www.w3.org/2000/svg">
                        <use href="#icon_view" />
                      </svg></span>
                </button>
                <button class="pc__btn-wl bg-transparent border-0 js-add-wishlist" title="Add To Wishlist">
                  <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <use href="#icon_heart" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div><!-- /.row -->
      <div class="text-center mt-2">
        <a class="btn-link btn-link_lg default-underline text-uppercase fw-medium" href="#">Load More</a>
      </div>
    </section>
  </div>
  <div class="mb-3 mb-xl-5 pt-1 pb-4"></div>
</main>

<div th:replace="Website/inc :: footer"></div>
</body>
</html>
