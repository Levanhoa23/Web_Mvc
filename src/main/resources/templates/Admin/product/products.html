<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="Admin/inc :: links">
</head>

<body class="body">
    <div id="wrapper">
        <div id="page" class="">
            <div class="layout-wrap">
                <div class="section-menu-left">
                    <div class="box-logo">
                       <div th:replace="Admin/inc :: logo"></div>
                        <div class="button-show-hide">
                            <i class="icon-menu-left"></i>
                        </div>
                    </div>
                    <div class="center">
                        <div class="center-item">
                            <div class="center-heading">Main Home</div>
                            <ul class="menu-list">
                                <li class="menu-item">
                                    <a href="/Admin" class="">
                                        <div class="icon"><i class="icon-grid"></i></div>
                                        <div class="text">Dashboard</div>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div th:replace="Admin/inc :: center"></div>
                    </div>
                </div>
                <div class="section-content-right">

           <div th:replace="Admin/inc :: header-dashboard"></div>
                    <div class="main-content">

                        <div class="main-content-inner">
                            <div class="main-content-wrap">
                                <div class="flex items-center flex-wrap justify-between gap20 mb-27">
                                    <h3>All Products</h3>
                                    <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                                        <li>
                                            <a href="../dashboard.html">
                                                <div class="text-tiny">Dashboard</div>
                                            </a>
                                        </li>
                                        <li>
                                            <i class="icon-chevron-right"></i>
                                        </li>
                                        <li>
                                            <div class="text-tiny">All Products</div>
                                        </li>
                                    </ul>
                                </div>

                                <div class="wg-box">
                                    <div class="flex items-center justify-between gap10 flex-wrap">
                                        <div class="wg-filter flex-grow">
                                            <form class="form-search">
                                                <fieldset class="name">
                                                    <input type="text" placeholder="Search here..." class="" name="name"
                                                        tabindex="2" value="" aria-required="true" required="">
                                                </fieldset>
                                                <div class="button-submit">
                                                    <button class="" type="submit"><i class="icon-search"></i></button>
                                                </div>
                                            </form>
                                        </div>
                                        <a class="tf-button style-1 w208" href="/add-product"><i
                                                class="icon-plus"></i>Add new Product</a>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-striped table-bordered">
                                            <thead>
                                            <tr>
                                                <th>STT</th>
                                                <th>Thumbnail</th>
                                                <th>ID</th>
                                                <th>Name</th>
                                                <th>Description</th>
                                                <th>Price</th>
                                                <th>Quantity</th>
                                                <th>Category</th>
                                                <th>Action</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr th:each="product, iterStat : ${products}">
                                                <td th:text="${iterStat.count}"></td>
                                                <td>
                                                    <div class="image">
                                                        <img th:src="@{${product.thumbnail}}" alt="Thumbnail" class="image">
                                                    </div>
                                                </td>
                                                <td th:text="${product.id}"></td>
                                                <td>
                                                    <a href="#" class="body-title-2" th:text="${product.name}"></a>
                                                </td>
                                                <td>
                                                    <div class="text-tiny mt-3" th:text="${product.description}"></div>
                                                </td>

                                                <td th:text="${product.price}"></td>
                                                <td th:text="${product.quantity}"></td>
                                                <td th:text="${product.category.name}"></td>
                                                <td>
                                                    <div class="list-icon-function">
                                                        <a href="#" target="_blank">
                                                            <div class="item eye">
                                                                <i class="icon-eye"></i>
                                                            </div>
                                                        </a>
                                                        <a th:href="@{/edit-product/{id}(id=${product.id})}">
                                                            <div class="item edit">
                                                                <i class="icon-edit-3"></i>
                                                            </div>
                                                        </a>



                                                        <form th:action="@{/products/{id}(id=${product.id})}" method="POST">
                                                            <input type="hidden" name="_method" value="DELETE"/> <!-- Chuyển POST -> DELETE -->
                                                            <input type="hidden" name="productId" th:value="${product.id}"/>
                                                            <button type="submit" class="item text-danger delete">
                                                                <i class="icon-trash-2"></i> <!-- Icon xóa sản phẩm -->
                                                            </button>
                                                        </form>

                                                    </div>
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>

                                    </div>

                                    <div class="divider"></div>
                                    <div class="flex items-center justify-between flex-wrap gap10 wgp-pagination">


                                    </div>
                                </div>
                            </div>
                        </div>
                    <div th:replace="Admin/inc :: bottom-page"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="Admin/inc :: footer"></div>
</body>

</html>
